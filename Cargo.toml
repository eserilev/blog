[workspace]
resolver = "3"
members = ["crates/logbook-core", "crates/logbook-render", "crates/logbook-server", "editor-wasm"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/eserilev/blog"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The editor WASM: small and fast to load.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
