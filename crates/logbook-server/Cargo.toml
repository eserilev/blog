[package]
name = "logbook-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "logbook"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ipnet = "2.12.2"
logbook-core = { version = "0.1.0", path = "../logbook-core" }
logbook-render = { version = "0.1.0", path = "../logbook-render" }
object_store = { version = "0.14.2", features = ["aws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rss = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "time", "process"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }
webauthn-rs = "0.5.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1.5"
proptest = "1.11.0"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }
