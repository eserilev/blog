# cargo-deny (spec 7.1): licenses, duplicates, sources, advisories.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # bincode 1 is unmaintained, not vulnerable. syntect uses it only to load its
    # built-in syntax and theme data at startup. No input from users reaches it.
    { id = "RUSTSEC-2025-0141", reason = "syntect loads built-in data with it; no untrusted input" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    # Mozilla root certificates (webpki-root-certs), a permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
