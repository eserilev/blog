# The restore test stack (spec 7.7): the app and SeaweedFS as a local S3.
# MinIO no longer publishes images, so the test uses SeaweedFS.
# Run: deploy/restore-test.sh

name: logbook-test

services:
  s3:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=64 -volume.max=8
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 60

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: logbook:test
    environment:
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: ${S3_BUCKET:-logbook}
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      ALLOW_EMPTY_START: ${ALLOW_EMPTY_START:-}
      LOGBOOK_ORIGIN: http://localhost:18090
      LOGBOOK_SURF: "off"
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:18090:8080"
    depends_on:
      s3:
        condition: service_healthy

volumes:
  data:
